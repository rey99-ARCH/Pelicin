name: Build IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: |
          xcodegen generate
          xcodebuild -project Pelicin.xcodeproj -scheme Pelicin -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Pelicin.app Payload/
          zip -qr Pelicin.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Pelicin-ipa
          path: Pelicin.ipa
          if-no-files-found: error
